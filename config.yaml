# --- BioDemux Configuration ---

reference_builder:
  fasta_path: Read_file/barcodes.fasta
  edge: auto
  groups:
    left:
      prefixes: ["FB"]
    right:
      prefixes: ["RB"]
  
  adapter_discovery:
    enabled: true
    sample_size: 5000
    window_size: 300
    min_abundance: 0.1
  
  max_adapter_errors: 10
  max_barcode_errors: 10

scoring:
  mismatch: 2
  insertion: 3
  deletion: 3
  wrong_order_penalty: 100
  distance_penalty_per_base: 1
  extra_flank_penalty: 1
  duplicate_site_penalty: 50
  repeat_primer_penalty: 50

layout_rules:
  # We allow both full and partial (single-end) layouts to maximize assignment.
  valid_layouts:
    - ["left_adapter", "left_barcode", "right_barcode", "right_adapter"]
    - ["left_adapter", "left_barcode", "right_adapter", "right_barcode"]
    - ["left_adapter", "left_barcode"]
    - ["right_barcode", "right_adapter"]
    - ["right_adapter", "right_barcode"]
    - ["left_barcode"]
    - ["right_barcode"]

  # How much difference between top candidates to consider it "Ambiguous"
  # We set it to a small value so we mostly pick the best match.
  ambiguity_margin: 2

  allowed_distances:
    left_adapter_to_left_barcode:
      from: left_adapter
      to: left_barcode
      min: 0
      max: 100
    right_adapter_to_right_barcode:
      from: right_adapter
      to: right_barcode
      min: 0
      max: 100

  match_sites:
    left_adapter: {role: adapter, side: left}
    right_adapter: {role: adapter, side: right}
    left_barcode: {role: barcode, side: left}
    right_barcode: {role: barcode, side: right}

primer_discovery:
  enabled: false

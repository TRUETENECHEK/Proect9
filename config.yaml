sequences:
  left_fwd:
    adapter: "NNNNNNNNNN" # ЗАМЕНИТЬ НА РЕАЛЬНУЮ ПОСЛЕДОВАТЕЛЬНОСТЬ ЛЕВОГО АДАПТЕРА
    barcodes:
      - "FB1"
      - "FB2"
      - "FB3"
      - "FB4"
      - "FB5"
      - "FB6"
      - "FB7"
      - "FB8"
      - "FB9"
      - "FB10"
      - "FB11"
      - "FB12"
  right_rev:
    adapter: "NNNNNNNNNN" # ЗАМЕНИТЬ НА РЕАЛЬНУЮ ПОСЛЕДОВАТЕЛЬНОСТЬ ПРАВОГО АДАПТЕРА
    barcodes:
      - "RB1"
      - "RB2"
      - "RB3"
      - "RB4"
      - "RB5"
      - "RB6"
      - "RB7"
      - "RB8"
  # Примечание: Баркоды берутся из внешних FASTA файлов:
  # - Баркоды: Read_file/barcodes.fasta

reference_builder:
  fasta_path: "Read_file/barcodes.fasta"
  edge: "auto"  # prefix, suffix или auto
  groups:
    left:
      prefixes: ["FB"]
    right:
      prefixes: ["RB"]

scoring_weights:
  mismatch: -2                 # Штраф за несовпадение (замена)
  insertion: -3                # Штраф за вставку
  deletion: -3                 # Штраф за удаление
  wrong_order_penalty: -100    # Огромный штраф за нарушение порядка элементов
  distance_penalty_per_base: -1 # Штраф за каждый лишний нуклеотид между сайтами
  extra_flank_penalty: -1
  duplicate_site_penalty: -50
  repeat_primer_penalty: -50

layout_scoring:
  edit_penalties:
    mismatch: 2
    insertion: 3
    deletion: 3
  wrong_order_penalty: 100
  distance_penalty_per_base: 1
  extra_flank_penalty: 1
  duplicate_site_penalty: 50
  repeat_primer_penalty: 50

layout_rules:
  ambiguity_margin: 0

  match_sites:
    left_adapter:
      role: adapter
      side: left
      aliases: ["left_adapter", "left_fwd", "left"]
    right_adapter:
      role: adapter
      side: right
      aliases: ["right_adapter", "right_rev", "right"]
    left_barcode:
      role: barcode
      side: left
      aliases: ["left_barcode", "left_barcode_core", "left_bc"]
    right_barcode:
      role: barcode
      side: right
      aliases: ["right_barcode", "right_barcode_core", "right_bc"]

  allowed_adapter_pairs:
    - first:
        side: left
        strand: any
        direction: any
      second:
        side: right
        strand: any
        direction: any
    - first:
        side: right
        strand: any
        direction: any
      second:
        side: left
        strand: any
        direction: any

  valid_layouts:
    - ["left_adapter", "left_barcode", "right_barcode", "right_adapter"]
    - ["right_adapter", "right_barcode", "left_barcode", "left_adapter"]
  
  allowed_distances:
    left_adapter_to_left_barcode:
      from: left_adapter
      to: left_barcode
      min: 0
      max: 30
    right_barcode_to_right_adapter:
      from: right_barcode
      to: right_adapter
      min: 0
      max: 30

primer_discovery:
  enabled: true
  output_path: "Read_file/primer.fasta"
  status: "Pass"
  max_total_penalty: 0
  left_window: 40
  right_window: 40
  primer_length: 20
  edit_distance_threshold: 1
  min_support: 1
  max_per_side: 1
  require_unique_in_read: true
